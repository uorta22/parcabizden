name: Deploy PHP to Natro

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/auto-parts-request-site-OpsbX
    paths:
      - 'natro-index.php'
      - 'php-backend/**'
      - 'api/**'
      - '.github/workflows/deploy-php.yml'

env:
  # Node.js 20 → 24 geçişi (Haziran 2026'da default olacak)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP dosyalarini hazirla
        run: |
          mkdir -p deploy/endpoints/auth
          mkdir -p deploy/endpoints/garage
          mkdir -p deploy/tmp/rate_limits

          # 1) natro-index.php → index.php (ana router)
          cp natro-index.php deploy/index.php

          # 2) api/ — temel sistem dosyaları (config, db, rate_limit, vehicle_db)
          #    NOT: api/auth.php ATLANIR — php-backend/auth.php daha kapsamlı
          for f in api/*.php; do
            fname="$(basename "$f")"
            case "$fname" in
              index.php) echo "SKIP api/index.php (natro-index.php kullaniliyor)" ;;
              auth.php)  echo "SKIP api/auth.php  (php-backend/auth.php kullaniliyor)" ;;
              *) cp "$f" deploy/ && echo "COPY api/$fname" ;;
            esac
          done

          # 3) api/endpoints/ — katalog endpoint'leri
          for f in api/endpoints/*.php; do
            [ -f "$f" ] && cp "$f" deploy/endpoints/ && echo "COPY endpoints/$(basename "$f")"
          done
          for f in api/endpoints/auth/*.php; do
            [ -f "$f" ] && cp "$f" deploy/endpoints/auth/ && echo "COPY endpoints/auth/$(basename "$f")"
          done
          for f in api/endpoints/garage/*.php; do
            [ -f "$f" ] && cp "$f" deploy/endpoints/garage/ && echo "COPY endpoints/garage/$(basename "$f")"
          done

          # 4) php-backend/ — uygulama modülleri (auth dahil, migration scriptleri hariç)
          for f in php-backend/*.php; do
            case "$(basename "$f")" in
              migrate-*.php|bigdump.php|image-import.php|migrate-7zap.php) echo "SKIP: $f" ;;
              *) cp "$f" deploy/ && echo "COPY php-backend/$(basename "$f")" ;;
            esac
          done

          # 5) rate_limits klasörü için .htaccess koru
          echo "Deny from all" > deploy/tmp/rate_limits/.htaccess

          echo ""
          echo "=== Deploy edilecek dosyalar ==="
          find deploy -name "*.php" | sort

      - name: FTPS Deploy to Natro
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./deploy/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.env
            **/error_log
            **/*.txt
            **/*.log
            **/*.db
            **/tmp/rate_limits/**
            **/migration*.sql
            **/catalog_schema.sql
