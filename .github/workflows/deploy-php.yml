name: Deploy PHP to Natro

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/auto-parts-request-site-OpsbX
    paths:
      - 'natro-index.php'
      - 'php-backend/**'
      - '.github/workflows/deploy-php.yml'

env:
  # Node.js 20 → 24 geçişi (Haziran 2026'da default olacak)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP dosyalarini hazirla
        run: |
          mkdir -p deploy/tmp/rate_limits deploy/tmp/seller-docs

          # 1) natro-index.php → index.php (ana router)
          cp natro-index.php deploy/index.php

          # 2) php-backend/ — uygulama modülleri (auth, tecdoc, vs.)
          #    Migration / yönetim scriptleri hariç tutulur
          for f in php-backend/*.php; do
            case "$(basename "$f")" in
              migrate-*.php|bigdump.php|image-import.php|migrate-7zap.php) echo "SKIP: $f" ;;
              *) cp "$f" deploy/ && echo "COPY php-backend/$(basename "$f")" ;;
            esac
          done

          # 3) rate_limits klasörü için .htaccess koru
          echo "Deny from all" > deploy/tmp/rate_limits/.htaccess

          # 4) Satıcı belgeleri (vergi levhası) — web kökünden erişilemez
          echo "Deny from all" > deploy/tmp/seller-docs/.htaccess

          echo ""
          echo "=== Deploy edilecek dosyalar ==="
          find deploy -name "*.php" | sort

      - name: FTPS Deploy to Natro
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./deploy/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.env
            **/error_log
            **/*.txt
            **/*.log
            **/*.db
            **/tmp/rate_limits/**
            **/tmp/seller-docs/**
            **/migration*.sql
            **/catalog_schema.sql
