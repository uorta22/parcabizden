name: Deploy PHP to Natro

on:
  workflow_dispatch:
  push:
    branches:
      - claude/auto-parts-request-site-OpsbX
    paths:
      - 'natro-index.php'
      - 'php-backend/**'
      - 'api/**'

jobs:
  deploy-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP dosyalarini hazirla
        run: |
          mkdir -p deploy
          # natro-index.php → index.php olarak kopyala
          cp natro-index.php deploy/index.php
          # php-backend altindaki tum PHP dosyalarini duz dizine kopyala
          cp php-backend/*.php deploy/

      - name: FTP Deploy - Ana site
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.env
            **/error_log
            **/*.txt
            **/*.log

  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy - API
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./api/
          server-dir: ../api.parcabizden.com.tr/
          dangerous-clean-slate: false
          exclude: |
            **/.env
            **/.env.example
            **/error_log
            **/*.db
            **/*.log
            **/*.txt
